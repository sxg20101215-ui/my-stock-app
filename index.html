<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>A股龙虎榜 K 线看板</title>
  <!-- ECharts CDN -->
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #f8fafc;
      color: #0f172a;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
    }
    /* 顶部导航与搜索栏 */
    .header {
      padding: 12px 16px;
      background: #ffffff;
      border-bottom: 1px solid #e2e8f0;
      display: flex;
      gap: 10px;
      align-items: center;
    }
    .input-group {
      flex: 1;
      display: flex;
      background: #f1f5f9;
      border-radius: 8px;
      padding: 4px 8px;
    }
    .input-group input {
      border: none;
      background: transparent;
      width: 100%;
      padding: 8px;
      font-size: 16px;
      outline: none;
    }
    .btn-search {
      background: #2563eb;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 8px 16px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-search:active {
      opacity: 0.8;
    }
    /* 图例说明区 */
    .legend-bar {
      display: flex;
      justify-content: space-around;
      padding: 8px 16px;
      background: #fff;
      font-size: 12px;
      border-bottom: 1px solid #f1f5f9;
    }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
    }
    /* 图表渲染容器 */
    #chart {
      flex: 1;
      width: 100%;
    }
    /* 龙虎榜明细弹出卡片 */
    .lhb-card {
      display: none;
      position: absolute;
      bottom: calc(20px + env(safe-area-inset-bottom));
      left: 16px;
      right: 16px;
      background: #ffffff;
      border-radius: 12px;
      padding: 16px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
      border: 1px solid #e2e8f0;
      z-index: 100;
    }
    .lhb-card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .lhb-title {
      font-size: 15px;
      font-weight: 700;
      color: #1e293b;
    }
    .btn-close {
      background: #f1f5f9;
      border: none;
      border-radius: 50%;
      width: 24px;
      height: 24px;
      font-size: 14px;
      color: #64748b;
      cursor: pointer;
    }
    .lhb-detail-item {
      font-size: 13px;
      margin-top: 4px;
      color: #475569;
    }
    .lhb-detail-item span {
      font-weight: 600;
      color: #0f172a;
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="input-group">
      <input type="text" id="stockCode" placeholder="请输入股票代码 (如 600088)" value="600088">
    </div>
    <button class="btn-search" onclick="fetchData()">查询</button>
  </div>

  <div class="legend-bar">
    <div class="legend-item"><div class="dot" style="background:#ef4444"></div>振幅达15%</div>
    <div class="legend-item"><div class="dot" style="background:#f59e0b"></div>换手达20%</div>
    <div class="legend-item"><div class="dot" style="background:#3b82f6"></div>偏离值达标</div>
    <div class="legend-item"><div class="dot" style="background:#dc2626"></div>其他上榜</div>
  </div>

  <div id="chart"></div>

  <div id="lhbCard" class="lhb-card">
    <div class="lhb-card-header">
      <div class="lhb-title">龙虎榜明细 (<span id="lhbDate">--</span>)</div>
      <button class="btn-close" onclick="document.getElementById('lhbCard').style.display='none'">✕</button>
    </div>
    <div class="lhb-detail-item">上榜原因：<span id="lhbReason">--</span></div>
    <div class="lhb-detail-item">净买入额：<span id="lhbNet" style="color:#ef4444;">--</span> 万元</div>
  </div>

  <script src="app.js"></script>
</body>
</html>
